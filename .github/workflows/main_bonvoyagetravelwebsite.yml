name: Build and deploy ASP.Net Core app to Azure Web App - bonvoyageTravelWebsite

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET Core
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.x'

      - name: Build with dotnet
        run: dotnet build BonVoyage_capstone_v1/BonVoyage_capstone.sln --configuration Release

      - name: dotnet publish
        run: dotnet publish BonVoyage_capstone_v1/BonVoyage_capstone.sln -c Release -o ${{github.workspace}}/BonVoyage_capstone_v1/publish

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: .net-app
          path: ${{github.workspace}}/BonVoyage_capstone_v1/publish

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: 'Production'
      url: ${{ steps.deploy-to-webapp.outputs.webapp-url }}
    permissions:
      id-token: write # This is required for requesting the JWT

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: .net-app
      
      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_80C409A3C83C49BF9A68A2E8F5D6E2F1 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_DFE06143B85E42B7885460D3D5455201 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_35D87DC337CF4412A3704286343BB61E }}

      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'bonvoyageTravelWebsite'
          slot-name: 'Production'
          package: ${{github.workspace}}/.net-app
